<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open-GEX</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
  <style>
    body { background: #07080a; }
    .card { background: #0f1115; border: 1px solid #1f2329; border-radius: 0.5rem; }
    .seg { display: inline-flex; border: 1px solid #2a2f37; border-radius: 0.375rem; overflow: hidden; }
    .seg button { padding: 0.375rem 0.75rem; font-size: 0.8125rem; font-weight: 500; color: #9ca3af; background: transparent; }
    .seg button + button { border-left: 1px solid #2a2f37; }
    .seg button:hover { color: #e5e7eb; background: #161a20; }
    .seg button[aria-pressed="true"] { color: #fff; background: #1f2937; }
    .badge { border-radius: 0.25rem; padding: 0.125rem 0.5rem; font-weight: 500; }
    .badge-live { color: #22c55e; background: rgba(34, 197, 94, 0.12); }
    .badge-delayed { color: #f59e0b; background: rgba(245, 158, 11, 0.12); }
    .num { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="min-h-screen text-neutral-200 antialiased" data-refresh-seconds="{{ refresh_seconds }}">
  <header class="border-b border-neutral-800 bg-[#0b0d10]">
    <div class="mx-auto flex max-w-7xl flex-wrap items-center gap-3 px-4 py-3">
      <h1 class="mr-2 text-lg font-semibold tracking-tight text-white">Open-GEX</h1>

      <div id="ticker-group" class="seg" role="group" aria-label="Ticker">
        {% for ticker in tickers %}
        <button type="button" data-ticker="{{ ticker }}" aria-pressed="{{ 'true' if loop.first else 'false' }}">{{ ticker }}</button>
        {% endfor %}
      </div>

      <div id="expiry-group" class="seg" role="group" aria-label="Expiry filter">
        <button type="button" data-expiry="0dte" aria-pressed="true">0DTE</button>
        <button type="button" data-expiry="all" aria-pressed="false">All (≤ {{ max_dte_all }}d)</button>
      </div>

      <button id="refresh-btn" type="button" class="rounded-md border border-neutral-700 px-3 py-1.5 text-[13px] text-neutral-300 hover:bg-neutral-800 hover:text-white">
        Refresh
      </button>

      <span id="loading" class="items-center gap-2 text-xs text-neutral-400" role="status" style="display: none">
        <svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" class="opacity-25"></circle>
          <path d="M22 12a10 10 0 0 0-10-10" stroke="currentColor" stroke-width="3" stroke-linecap="round"></path>
        </svg>
        <span id="loading-text">Loading…</span>
      </span>

      <div class="ml-auto flex items-center gap-3 text-xs">
        <span id="source-badge" class="badge badge-delayed">–</span>
        <span id="updated" class="num text-neutral-400">–</span>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-7xl space-y-4 px-4 py-4">
    <div id="banner" class="hidden rounded-md border border-amber-500/30 bg-amber-500/5 px-4 py-2 text-sm" role="alert">
      <ul id="banner-list" class="space-y-1"></ul>
    </div>

    <section class="grid grid-cols-2 gap-3 md:grid-cols-5">
      <div class="card p-4">
        <div class="text-[11px] uppercase tracking-wider text-neutral-500">Spot</div>
        <div id="kpi-spot" class="num mt-1 text-2xl text-white">–</div>
        <div id="kpi-spot-sub" class="num mt-1 text-xs text-neutral-500">&nbsp;</div>
      </div>
      <div class="card p-4">
        <div class="text-[11px] uppercase tracking-wider text-neutral-500">Zero Gamma</div>
        <div id="kpi-zg" class="num mt-1 text-2xl text-violet-300">–</div>
        <div id="kpi-zg-sub" class="num mt-1 text-xs text-neutral-500">&nbsp;</div>
      </div>
      <div class="card p-4">
        <div class="text-[11px] uppercase tracking-wider text-neutral-500">Call Wall</div>
        <div id="kpi-cw" class="num mt-1 text-2xl text-[#22c55e]">–</div>
        <div id="kpi-cw-sub" class="num mt-1 text-xs text-neutral-500">&nbsp;</div>
      </div>
      <div class="card p-4">
        <div class="text-[11px] uppercase tracking-wider text-neutral-500">Put Wall</div>
        <div id="kpi-pw" class="num mt-1 text-2xl text-[#ef4444]">–</div>
        <div id="kpi-pw-sub" class="num mt-1 text-xs text-neutral-500">&nbsp;</div>
      </div>
      <div class="card col-span-2 p-4 md:col-span-1">
        <div class="text-[11px] uppercase tracking-wider text-neutral-500">Net GEX</div>
        <div id="kpi-gex" class="num mt-1 text-2xl text-white">–</div>
        <div id="kpi-gex-sub" class="mt-1 text-xs text-neutral-500">&nbsp;</div>
      </div>
    </section>

    <section class="card p-4">
      <div class="mb-2 flex flex-wrap items-center justify-between gap-2">
        <h2 id="chart-title" class="text-sm font-medium text-neutral-300">Net GEX by strike</h2>
        <div id="metric-group" class="seg" role="group" aria-label="Exposure">
          <button type="button" data-metric="gex" aria-pressed="true">GEX</button>
          <button type="button" data-metric="vanna" aria-pressed="false">Vanna</button>
        </div>
      </div>
      <div id="chart" class="h-[65vh] min-h-[420px] w-full"></div>
    </section>
  </main>

  <footer class="mx-auto max-w-7xl px-4 pb-6 text-center text-xs text-neutral-500">
    For educational purposes only. Not financial advice.
  </footer>

  <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
